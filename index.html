<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel City</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pixel-city" data-pixel-city data-assets="assets/" data-zoom="2"></div>
  <script>
    // city.js reads data-zoom once, on mount: narrow screens get 100% (1 CSS
    // px per art px), wider ones 200%.
    if (window.matchMedia('(max-width: 980px)').matches) {
      document.querySelector('[data-pixel-city]').dataset.zoom = '1';
    }
  </script>
  <script src="js/city.js"></script>
</body>
</html>
