<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel City</title>
  <meta name="description" content="An isometric pixel-art city with animated traffic and a hero car following a GPS.">
  <!-- Link previews. Open Graph needs an absolute image URL. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pixel City">
  <meta property="og:description" content="An isometric pixel-art city with animated traffic and a hero car following a GPS.">
  <meta property="og:url" content="https://luizopiloto.github.io/pixel-city/">
  <meta property="og:image" content="https://luizopiloto.github.io/pixel-city/thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pixel-city" data-pixel-city data-assets="assets/" data-zoom="2"></div>
  <script>
    // city.js reads data-zoom once, on mount: narrow screens get 100% (1 CSS
    // px per art px), wider ones 200%.
    if (window.matchMedia('(max-width: 980px)').matches) {
      document.querySelector('[data-pixel-city]').dataset.zoom = '1';
    }
  </script>
  <script src="js/city.js"></script>
</body>
</html>
